param_names:
    c
    SALT2beta
    RV
    x1
    EBV

nuisance_parameters:
    gammaDM
    sigint
    2POPS

#Need to make it clear the list of available keys

parameters_to_condition_on:
    ['c', 'mB', 'x1', 'zHD', 'cERR', 'mBERR', 'x1ERR', 'MU', 'HOST_LOGMASS', 'MURES']

sim_parameters:
    n_sim:   100_000 
    n_batch: 500
    simname: 'simulations/sims.v5.NOM.h5'
    posteriorname: 'posteriors/posterior.v5.NOM.pt'

#Optional key; for use with run_nre.py. Otherwise leave as None
Models_Comparison:
    STJARNA_SINGLE_RV.yml
    STJARNA_NO_STEP.yml
    STJARNA_BANANA.yml
    STJARNA_LESS_BANANA.yml
    STJARNA_LOG.yml
    STJARNA_2COLOURS.yml

Data_File:
    "DES5YR.FITRES.gz"
Simbank_File:
    "SIMBANK_BIG.FITRES.gz"


#########################
# Skysurvey 
#########################

#Override feature to force use of skysurvey. Disables Functions, Splits, Correlations, and currently Priors as well 

#########################
# Dictionaries 
#########################

Functions:
    c:    DistGaussian  #The shape of this parameter.
    RV:   DistLogistic
    EBV:  DistExponential
    SALT2beta: DistIdentity
    x1:   DistGaussian
    gammaDM: host_step
    sigint: DistIdentity

#need to clarify list of available Functions

Splits:
    gammaDM:    ["Stepwise", "host_LOGMASS", 10]
#    RV:  ["Stepwise","host_LOGMASS", 10] #A list containing the split parameter and location
#    EBV: ["Stepwise","HOST_LOGMASS", 10]

Correlations:
    RV: host_LOGMASS
    x1: host_LOGMASS



# We assume BoxUniform priors for our parameters; 
# so each tuple needs to include the lower and upper bound you expect for that parameter. 
# Gaussians are formatted as mu then sigma

Priors:
    c:    ['(-.1, 0)', '(0.02, 0.1)']
    EBV:  ['(0.05, 0.5)']
    SALT2beta: ['(1.5,3)', '(0.05, 0.3)']
    x1:   ['(-2,2)', '(0.2, 1.5)']
    x1_EVOL: ['(-0.2,0.2)']
    gammaDM:     ['(-0.2,0.2)']
    sigint:  ['(0,0.1)']
    RV:   ['(1,3)','(-1.5, 2.1)', '(0,.5)'] #L, k, sigma
    #RV:   ['(1.5,6)', '(0.2,1.2)']


# Fancy latex labels for plotting. Add as you see fit. 
Latex_Names:
    DistExponential:   ['$\tau$']
    DistGaussian:      ['$\mu$', '$\sigma$']
    DistGaussian_EVOL: ['$\mu$', '$\sigma$', '$\mu slope$']
    SIM_c:             '$c_{int}$'
    SIM_beta:          '$\beta_{int}$'
    SIM_RV:            '$R_V$'
    SIM_EBV:           '$EBV$'
    SIM_x1:            '$x_1$'
    STEP:              '$\gamma$'
    SCATTER:           '$\sigma_{int}$'
    DistLogistic:      ['$L$', '$k$', '$\sigma$']
